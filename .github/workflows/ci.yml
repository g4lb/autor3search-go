name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -short -count=1
        if: matrix.go != 'stable'
      - run: go test ./... -count=1
        if: matrix.go == 'stable'
      # -short on purpose: the measuring tests spend their wall time inside
      # child `go test -bench` processes, which are compiled without -race and
      # so are never instrumented. Re-running them here re-pays the whole
      # benchmark cost for no extra race coverage. The step above already runs
      # them once, unrestricted.
      - run: go test ./... -race -short -count=1
        if: matrix.go == 'stable'
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  # Windows is a build target the code goes out of its way to support —
  # every syscall-dependent piece has a !unix implementation — but nothing
  # ever ran it there. It is a DEGRADED platform on purpose: no process
  # groups, no advisory locks, no `stop -force`. This job guards the part
  # that must still work: the build, and every test not tagged unix-only.
  windows:
    runs-on: windows-latest
    # Well above the -timeout below, deliberately. The job cap firing first
    # kills the step with "The operation was canceled" and no goroutine
    # dump, which is exactly the outcome that teaches nothing.
    timeout-minutes: 45
    steps:
      # Before the checkout, and the reason this job has an extra step at
      # all: the Windows runner image sets core.autocrlf=true, which would
      # rewrite every checked-out .go file to CRLF. The freeze package
      # hashes file contents and the template tests compare them byte for
      # byte, so that rewrite alone would fail tests that have nothing
      # wrong with them, on this platform only.
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      # -timeout is per package and must stay BELOW the job cap, so a stuck
      # package is killed by go test — which dumps every goroutine and names
      # the test — rather than by the runner, which says only that the job
      # was cancelled. 12m is far more than any package needs (the whole
      # suite is ~100s on a developer machine, and this runner links the
      # test binaries in seconds) while leaving room for the rest of the
      # packages to finish after one of them blows up.
      - run: go test ./... -count=1 -timeout=12m
